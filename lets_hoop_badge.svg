<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 425">
  <defs>
    <clipPath id="b1c"><circle cx="155" cy="211" r="46"/></clipPath>
    <clipPath id="b2c"><circle cx="257" cy="211" r="46"/></clipPath>
  </defs>

  <!-- White background -->
  <rect width="420" height="425" fill="#FFFFFF"/>

  <!-- Structural frame border -->
  <rect x="12" y="8" width="396" height="409" rx="16"
    fill="none" stroke="#1A1A1A" stroke-width="5"/>

  <!-- ================================================================
       LINE 1 — LETS  (tangerine orange, spaced to match HOOP width)
       ================================================================ -->
  <text
    x="35" y="112"
    font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="130"
    font-style="italic"
    fill="#F07020"
    textLength="335"
    lengthAdjust="spacing">LETS</text>

  <!-- ================================================================
       LINE 2 — H [ball] [ball] P
       Baseline y=258  |  Cap height ≈ 95px  |  Cap top ≈ y=163
       ================================================================ -->

  <!-- H -->
  <text
    x="35" y="258"
    font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="130"
    font-style="italic"
    fill="#1A1A1A">H</text>

  <!-- ── BASKETBALL 1 (first O) — cx=155 cy=211 r=47 ──────────── -->
  <circle cx="155" cy="211" r="47" fill="#F07020"/>
  <g clip-path="url(#b1c)" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round">
    <path d="M 108,211 Q 155,190 202,211"/>
    <path d="M 108,211 Q 155,232 202,211"/>
    <path d="M 155,164 Q 135,211 155,258"/>
    <path d="M 155,164 Q 175,211 155,258"/>
  </g>
  <circle cx="155" cy="211" r="47" fill="none" stroke="#1A1A1A" stroke-width="4.5"/>

  <!-- ── BASKETBALL 2 (second O) — cx=257 cy=211 r=47 ─────────── -->
  <circle cx="257" cy="211" r="47" fill="#F07020"/>
  <g clip-path="url(#b2c)" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round">
    <path d="M 210,211 Q 257,190 304,211"/>
    <path d="M 210,211 Q 257,232 304,211"/>
    <path d="M 257,164 Q 237,211 257,258"/>
    <path d="M 257,164 Q 277,211 257,258"/>
  </g>
  <circle cx="257" cy="211" r="47" fill="none" stroke="#1A1A1A" stroke-width="4.5"/>

  <!-- P -->
  <text
    x="312" y="258"
    font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="130"
    font-style="italic"
    fill="#1A1A1A">P</text>

  <!-- ================================================================
       RIM — heavy horizontal bar connecting both hoops
       ================================================================ -->
  <line x1="108" y1="262" x2="304" y2="262"
    stroke="#1A1A1A" stroke-width="10" stroke-linecap="round"/>

  <!-- ================================================================
       GEOMETRIC DIAMOND NET MESH — tapered, 5 zigzag rows
       Row spacing 28px  |  Point spacing 24px  |  Taper 12px/side/row
       ================================================================ -->
  <g fill="none" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round">

    <!-- Row 0–1 -->
    <path d="M 110,268 L 122,296 L 134,268 L 146,296 L 158,268 L 170,296
             L 182,268 L 194,296 L 206,268 L 218,296 L 230,268 L 242,296
             L 254,268 L 266,296 L 278,268 L 290,296 L 302,268"/>

    <!-- Row 1–2 -->
    <path d="M 122,296 L 134,324 L 146,296 L 158,324 L 170,296 L 182,324
             L 194,296 L 206,324 L 218,296 L 230,324 L 242,296 L 254,324
             L 266,296 L 278,324 L 290,296"/>

    <!-- Row 2–3 -->
    <path d="M 134,324 L 146,352 L 158,324 L 170,352 L 182,324 L 194,352
             L 206,324 L 218,352 L 230,324 L 242,352 L 254,324 L 266,352
             L 278,324"/>

    <!-- Row 3–4 -->
    <path d="M 146,352 L 158,380 L 170,352 L 182,380 L 194,352 L 206,380
             L 218,352 L 230,380 L 242,352 L 254,380 L 266,352"/>

    <!-- Row 4–5 (bottom) -->
    <path d="M 158,380 L 170,408 L 182,380 L 194,408 L 206,380 L 218,408
             L 230,380 L 242,408 L 254,380"/>

  </g>

</svg>
