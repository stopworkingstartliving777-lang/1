<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <radialGradient id="ballGrad" cx="36%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#FFCA72"/>
      <stop offset="38%"  stop-color="#F07020"/>
      <stop offset="100%" stop-color="#8E2400"/>
    </radialGradient>
    <radialGradient id="ballSpec" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.50)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="100" cy="82" r="49"/>
    </clipPath>

  </defs>

  <!-- ── BACKGROUND ──────────────────────────────────────────────
       Primary / Dark mode : fill="#111111"
       Inverted / Mono     : fill="#FFFFFF" (flip ball/hoop colors)
       ──────────────────────────────────────────────────────────── -->
  <rect width="200" height="200" rx="44" fill="#111111"/>

  <!-- ── NET (behind rim back arc) ──────────────────────────────── -->
  <line x1="56"  y1="128" x2="78"  y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="67"  y1="125" x2="83"  y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="79"  y1="123" x2="88"  y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="91"  y1="122" x2="93"  y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="100" y1="122" x2="98"  y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="109" y1="122" x2="103" y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="121" y1="123" x2="108" y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="133" y1="125" x2="113" y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="144" y1="128" x2="118" y2="178" stroke="#BBBBBB" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Horizontal mesh -->
  <path d="M 59,140 Q 100,146 141,140" fill="none" stroke="#BBBBBB" stroke-width="1.4"/>
  <path d="M 62,155 Q 100,161 138,155" fill="none" stroke="#BBBBBB" stroke-width="1.4"/>
  <path d="M 68,170 Q 100,175 132,170" fill="none" stroke="#BBBBBB" stroke-width="1.4"/>
  <!-- Net bottom edge -->
  <path d="M 78,178 Q 98,183 118,178" fill="none" stroke="#BBBBBB" stroke-width="1.4"/>

  <!-- ── RIM — back arc (behind ball) ──────────────────────────── -->
  <path d="M 49,127 A 51,8 0 0,1 151,127"
    fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- ── BASKETBALL ─────────────────────────────────────────────── -->
  <circle cx="100" cy="82" r="50" fill="url(#ballGrad)"/>
  <g clip-path="url(#ballClip)" fill="none" stroke="#7A2200" stroke-width="2.6" stroke-linecap="round">
    <path d="M 50,82 Q 100,63 150,82"/>
    <path d="M 50,82 Q 100,101 150,82"/>
    <path d="M 100,32 Q 82,82 100,132"/>
    <path d="M 100,32 Q 118,82 100,132"/>
  </g>
  <ellipse cx="85" cy="62" rx="17" ry="12"
    fill="url(#ballSpec)" transform="rotate(-28 85 62)"/>
  <circle cx="100" cy="82" r="50" fill="none" stroke="#7A2200" stroke-width="2"/>

  <!-- ── RIM — front arc (in front of ball) ────────────────────── -->
  <path d="M 49,127 A 51,8 0 0,0 151,127"
    fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

</svg>
